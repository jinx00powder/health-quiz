<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار صحة القلب والجهاز الهضمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .disabled-option { pointer-events: none; }
        .matched-pair { opacity: 0.6; pointer-events: none; }
        .selected-item { border-color: #3b82f6 !important; background-color: #eff6ff !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-2xl bg-white shadow-sm border border-slate-200 rounded-2xl p-4 mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-heart-pulse text-red-550 text-red-600"></i> اختبار صحة القلب والجهاز الهضمي
            </h1>
            <p class="text-xs text-slate-500 mt-1">اختبر معلوماتك الطبية بناءً على الملفات التثقيفية</p>
        </div>
        <button onclick="openQRModal()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 border border-indigo-200 transition">
            <i class="fa-solid fa-qrcode text-base"></i>
            <span>رمز QR</span>
        </button>
    </header>

    <!-- Main Quiz Container -->
    <main class="w-full max-w-2xl bg-white shadow-xl border border-slate-200 rounded-3xl p-6 sm:p-8 mb-6 relative overflow-hidden">
        
        <!-- Progress Bar -->
        <div id="quiz-header" class="mb-6">
            <div class="flex justify-between items-center text-sm font-bold text-slate-600 mb-2">
                <span id="question-number">السؤال 1 من 10</span>
                <span id="points-badge" class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-bold">1 نقطة</span>
            </div>
            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 10%;"></div>
            </div>
        </div>

        <!-- Question Body -->
        <div id="question-container">
            <!-- Dynamic content inserted by JS -->
        </div>

        <!-- Explanation Container -->
        <div id="explanation-container" class="hidden mt-6 p-4 rounded-2xl bg-blue-50 border border-blue-200 text-blue-900 text-sm">
            <div class="font-bold mb-1 flex items-center gap-2">
                <i class="fa-solid fa-circle-info"></i> الشرح والتوضيح:
            </div>
            <p id="explanation-text"></p>
        </div>

        <!-- Footer Actions -->
        <div id="quiz-footer" class="mt-8 flex justify-end">
            <button id="next-btn" onclick="nextQuestion()" disabled class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white px-6 py-3 rounded-xl font-bold transition flex items-center gap-2">
                <span>السؤال التالي</span>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>

        <!-- Results View (Hidden initially) -->
        <div id="results-container" class="hidden text-center py-6">
            <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold mb-4">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">اكتمل الاختبار بنجاح!</h2>
            <p class="text-slate-600 mb-6">درجتك النهائية في الاختبار هي:</p>
            <div class="text-4xl font-extrabold text-indigo-600 mb-6">
                <span id="score-achieved">0</span> / <span id="score-total">14</span> نقطة
            </div>

            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button onclick="restartQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> إعادة الاختبار
                </button>
                <button onclick="openQRModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-6 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-share-nodes"></i> مشاركة عبر QR
                </button>
            </div>
        </div>
